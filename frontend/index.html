<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGForge — Multimodal Agentic RAG Platform</title>
  <meta name="description" content="Production Multimodal Agentic RAG Platform with MinIO S3, OpenSearch Vector Store, and Neo4j Knowledge Graph">
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="root">
    <!-- Clean Loading Indicator -->
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #64748b; font-size: 0.95rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 24px; height: 24px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <span>Initializing RAGForge React Platform...</span>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- React 18 Entry Point -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
